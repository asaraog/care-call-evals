[project]
name = "care-call-evals"
version = "0.1.0"
description = "Rubric-driven evaluation of real voice-agent call transcripts for patient-care failures"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
care-call-evals = "care_call_evals.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
